name: Ensure pull requests build with changes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths-ignore:
      - '.github/**' # Avoid issues with .github files

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - name: Clean install Node.js dependencies
        run: npm ci
      - name: Build package with Node.js
        run: npm run build # CI=false to ignore warnings
        env:
          CI: false